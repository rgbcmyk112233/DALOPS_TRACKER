{% extends "base.html" %} {% block title %}Profil Pelanggar{% endblock %} {% block content %}
<form method="POST" style="max-width: 700px; margin: 40px auto">
  <div class="card shadow-sm" style="border-radius: 12px">
    <div class="card-body p-4">
      <h4 class="text-center mb-1">Input Pelanggaran</h4>
      <h5 class="text-muted text-center mb-4">{{nama_pelanggar}}</h5>

      <!-- Pilih Pasal -->
      <div class="mb-4">
        <label class="form-label fw-bold">Pilih Pasal</label>

        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle w-100 text-start" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">Pilih Pasal</button>

          <ul class="dropdown-menu w-100 p-2 ps-5" aria-labelledby="dropdownMenuButton1" style="max-height: 300px; overflow-y: auto; white-space: normal">
            {% for i in pasal %}
            <li class="mb-2">
              <div class="form-check p-2" style="border-bottom: 1px solid #eee; white-space: normal">
                <input class="form-check-input" type="radio" name="no_pasal" id="pasal{{ loop.index }}" value="{{ no_pasal[loop.index - 1] }}" />

                <label class="form-check-label w-100" for="pasal{{ loop.index }}" style="cursor: pointer; word-wrap: break-word; overflow-wrap: break-word">
                  <strong>{{ no_pasal[loop.index - 1] }}</strong>
                  <br />

                  <span class="text-muted" style="font-size: 0.85rem; display: block; margin-top: 3px"> {{ bunyi_pasal[loop.index - 1] }} </span>
                </label>
              </div>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>

      <!-- Catatan Petugas -->
      <div class="mb-4">
        <label for="catatan_petugas" class="form-label fw-bold"> Catatan Petugas </label>

        <textarea class="form-control" id="catatan_petugas" name="catatan_petugas" rows="4" placeholder="Masukkan catatan petugas..."></textarea>
      </div>

      <!-- Tombol -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Simpan Pelanggaran</button>
      </div>
    </div>
  </div>
</form>
{% endblock %}
