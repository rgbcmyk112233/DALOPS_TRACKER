{% extends "base.html" %} {% block title %}Profil Pelanggar{% endblock %} {% block content %}
<form method="POST" style="max-width: 700px; margin: 40px auto">
  <div class="card shadow-sm" style="border-radius: 12px">
    <div class="card-body p-4">
      <h4 class="text-center mb-4">Input Pelanggaran</h4>

      <!-- Pilih Pasal -->
      <div class="mb-4">
        <label class="form-label fw-bold">Pilih Pasal</label>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="pasal" id="pasal1" value="Pasal 1" required />
          <label class="form-check-label" for="pasal1"> Pasal Placeholder 1 </label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="pasal" id="pasal2" value="Pasal 2" />
          <label class="form-check-label" for="pasal2"> Pasal Placeholder 2 </label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="pasal" id="pasal3" value="Pasal 3" />
          <label class="form-check-label" for="pasal3"> Pasal Placeholder 3 </label>
        </div>
      </div>

      <!-- Bunyi Pasal -->
      <div class="mb-4">
        <label class="form-label fw-bold">Bunyi Pasal</label>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="bunyi_pasal" id="bunyi1" value="Bunyi Pasal 1" required />
          <label class="form-check-label" for="bunyi1"> Bunyi Pasal Placeholder 1 </label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="bunyi_pasal" id="bunyi2" value="Bunyi Pasal 2" />
          <label class="form-check-label" for="bunyi2"> Bunyi Pasal Placeholder 2 </label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="bunyi_pasal" id="bunyi3" value="Bunyi Pasal 3" />
          <label class="form-check-label" for="bunyi3"> Bunyi Pasal Placeholder 3 </label>
        </div>
      </div>

      <!-- Catatan Petugas -->
      <div class="mb-4">
        <label for="catatan_petugas" class="form-label fw-bold"> Catatan Petugas </label>

        <textarea class="form-control" id="catatan_petugas" name="catatan_petugas" rows="4" placeholder="Masukkan catatan petugas..."></textarea>
      </div>

      <!-- Tombol -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Simpan Pelanggaran</button>
      </div>
    </div>
  </div>
</form>
{%endblock%}
